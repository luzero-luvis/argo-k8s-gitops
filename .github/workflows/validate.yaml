name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: azure/setup-helm@v4
      - uses: azure/setup-kubectl@v4
      - name: Install yamllint
        run: pipx install yamllint
      - name: Validate repository
        run: ./scripts/validate.sh
