{{- if .Values.httproute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "charts.fullname" . }}
  namespace: {{ include "charts.namespace" . }}
  labels:
    {{- include "charts.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.httproute.gateway.name }}
      namespace: {{ .Values.httproute.gateway.namespace }}
      sectionName: {{ .Values.httproute.gateway.sectionName }}
  hostnames:
    {{- range .Values.httproute.hostnames }}
    - {{ . | quote }}
    {{- end }}
  rules:
    {{- if .Values.httproute.redirectToHttps }}
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
    {{- else }}
    - backendRefs:
        - name: {{ include "charts.fullname" . }}
          port: {{ .Values.service.port }}
    {{- end }}
{{- if .Values.httproute.redirectToHttps }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "charts.fullname" . }}-https
  namespace: {{ include "charts.namespace" . }}
  labels:
    {{- include "charts.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.httproute.gateway.name }}
      namespace: {{ .Values.httproute.gateway.namespace }}
      sectionName: {{ .Values.httproute.gateway.sectionNameHttps }}
  hostnames:
    {{- range .Values.httproute.hostnames }}
    - {{ . | quote }}
    {{- end }}
  rules:
    - backendRefs:
        - name: {{ include "charts.fullname" . }}
          port: {{ .Values.service.port }}
      timeouts:
        request: {{ .Values.httproute.requestTimeout | quote }}
{{- end }}
{{- end }}
