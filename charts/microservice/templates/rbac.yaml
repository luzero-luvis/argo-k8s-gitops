{{- if and .Values.serviceAccount.create .Values.rbac.enabled }}
{{- if .Values.rbac.rules }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "charts.fullname" . }}
  namespace: {{ include "charts.namespace" . }}
  labels:
    {{- include "charts.labels" . | nindent 4 }}
rules:
  {{- toYaml .Values.rbac.rules | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "charts.fullname" . }}
  namespace: {{ include "charts.namespace" . }}
  labels:
    {{- include "charts.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "charts.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "charts.serviceAccountName" . }}
    namespace: {{ include "charts.namespace" . }}
{{- end }}
{{- if .Values.rbac.clusterRules }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "charts.fullname" . }}
  labels:
    {{- include "charts.labels" . | nindent 4 }}
rules:
  {{- toYaml .Values.rbac.clusterRules | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "charts.fullname" . }}
  labels:
    {{- include "charts.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "charts.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "charts.serviceAccountName" . }}
    namespace: {{ include "charts.namespace" . }}
{{- end }}
{{- end }}
