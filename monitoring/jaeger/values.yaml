fullnameOverride: jaeger

jaeger:
  replicas: 1
  serviceAccount:
    automountServiceAccountToken: false
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
  extraVolumes:
    - name: badger-data
      persistentVolumeClaim:
        claimName: jaeger-badger-data
  extraVolumeMounts:
    - name: badger-data
      mountPath: /badger

userconfig:
  extensions:
    healthcheckv2:
      use_v2: true
      http:
        endpoint: 0.0.0.0:13133
    jaeger_query:
      storage:
        traces: primary_store
    jaeger_storage:
      backends:
        primary_store:
          badger:
            ephemeral: false
            directories:
              keys: /badger/keys
              values: /badger/values
            ttl:
              spans: 168h
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318
  processors:
    memory_limiter:
      check_interval: 1s
      limit_mib: 1536
      spike_limit_mib: 256
    batch: {}
  exporters:
    jaeger_storage_exporter:
      trace_storage: primary_store
  service:
    extensions:
      - healthcheckv2
      - jaeger_storage
      - jaeger_query
    pipelines:
      traces:
        receivers:
          - otlp
        processors:
          - memory_limiter
          - batch
        exporters:
          - jaeger_storage_exporter
    telemetry:
      resource:
        service.name: jaeger
      metrics:
        level: detailed
        readers:
          - pull:
              exporter:
                prometheus:
                  host: 0.0.0.0
                  port: 8888

spark:
  enabled: false
esIndexCleaner:
  enabled: false
esRollover:
  enabled: false
esLookback:
  enabled: false
