apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasource-loki
  namespace: monitoring
  labels:
    grafana_datasource: "1"
data:
  loki.yaml: |-
    apiVersion: 1
    datasources:
      - name: Loki
        uid: loki
        type: loki
        access: proxy
        url: http://loki-gateway.monitoring.svc.cluster.local
        isDefault: false
        editable: false
        jsonData:
          derivedFields:
            - name: TraceID
              datasourceUid: jaeger
              matcherRegex: '(?:trace_id|traceId)[=": ]+([a-fA-F0-9]{16,32})'
              url: '${__value.raw}'
