apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hami
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  sources:
    - repoURL: https://project-hami.github.io/HAMi/
      chart: hami
      targetRevision: 2.10.0
      helm:
        releaseName: hami
        valueFiles:
          - $values/platform/compute/hami/values.yaml
    - repoURL: https://github.com/luzero-luvis/argo-k8s-gitops.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
