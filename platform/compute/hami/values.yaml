global:
  imageTag: v2.10.0
  managedNodeSelectorEnable: true
  managedNodeSelector:
    hami.io/managed: "true"

schedulerName: hami-scheduler

scheduler:
  # GPU workloads opt into HAMi explicitly through schedulerName. Avoid mutating
  # unrelated pods in this mixed GPU cluster.
  forceOverwriteDefaultScheduler: false
  admissionWebhook:
    enabled: false
  kubeScheduler:
    image:
      registry: registry.k8s.io
      repository: kube-scheduler
      tag: v1.36.3

devicePlugin:
  enabled: true
  deviceSplitCount: 2
  deviceMemoryScaling: 1
  deviceCoreScaling: 1
  service:
    type: ClusterIP
  nvidiaNodeSelector:
    hami.io/managed: "true"
  tolerations:
    - key: dedicated
      operator: Equal
      value: github-actions-runner
      effect: NoSchedule
  nodeConfiguration:
    config: |
      {
        "nodeconfig": [
          {
            "name": "node5",
            "operatingmode": "hami-core",
            "devicememoryscaling": 1,
            "devicesplitcount": 2,
            "preconfigureddevicememory": 0,
            "enablenumatopology": false,
            "migstrategy": "none",
            "filterdevices": {
              "uuid": [],
              "index": []
            },
            "enablegetpreferredallocation": false
          }
        ]
      }
