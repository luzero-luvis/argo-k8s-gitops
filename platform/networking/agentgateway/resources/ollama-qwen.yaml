apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: ollama-qwen3
  namespace: agentgateway-system
  labels:
    app.kubernetes.io/part-of: local-ai
spec:
  ai:
    provider:
      openai:
        # Enforce the one model that the Ollama init container installs.
        model: qwen3:1.7b
      host: ollama.ai.svc.cluster.local
      port: 11434
      path: /v1/chat/completions
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ollama-qwen3
  namespace: agentgateway-system
  annotations:
    external-dns.kubernetes.io/ttl: "300"
  labels:
    app.kubernetes.io/part-of: local-ai
spec:
  hostnames:
    - ai.example.com
  parentRefs:
    # Reuse the existing, programmed Gateway in agentgateway-system.
    - name: agentgateway
      sectionName: https
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /v1/chat/completions
      backendRefs:
        - name: ollama-qwen3
          group: agentgateway.dev
          kind: AgentgatewayBackend
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ollama-qwen3-http
  namespace: agentgateway-system
  labels:
    app.kubernetes.io/part-of: local-ai
spec:
  hostnames:
    - ai.example.com
  parentRefs:
    - name: agentgateway
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
