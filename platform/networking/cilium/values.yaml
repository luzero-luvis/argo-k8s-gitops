cluster:
  name: kubernetes

ipam:
  mode: kubernetes

routingMode: native
ipv4NativeRoutingCIDR: 10.244.0.0/16
autoDirectNodeRoutes: true
# Prevents Cilium from crashing when a node is on a different subnet/gateway
directRoutingSkipUnreachable: true

kubeProxyReplacement: true
k8sServiceHost: 192.168.1.10
k8sServicePort: 6443

# Keep socket-level service translation in the host namespace so it does not
# bypass Istio's traffic interception when kube-proxy replacement is enabled.
socketLB:
  hostNamespaceOnly: true

# Preserve Istio's chained CNI entry instead of replacing the host CNI config.
cni:
  exclusive: false

# Required by egress gateway (below) — switches SNAT from iptables to eBPF.
bpf:
  masquerade: true

# Lets CiliumEgressGatewayPolicy route chosen pods' egress traffic through a
# designated gateway node with a predictable source IP.
egressGateway:
  enabled: true

operator:
  replicas: 1

hubble:
  relay:
    enabled: true
  ui:
    enabled: true
