apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-latest-tag
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: require-pinned-image-tag
      match:
        any:
          - resources:
              kinds: [Pod]
      validate:
        message: Container images must not use the latest tag.
        pattern:
          spec:
            containers:
              - image: "!*:latest"
