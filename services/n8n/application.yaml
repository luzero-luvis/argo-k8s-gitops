apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: n8n
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: services
  sources:
    - repoURL: https://community-charts.github.io/helm-charts
      chart: n8n
      targetRevision: "1.*"
      helm:
        releaseName: n8n
        valueFiles:
          - $values/services/n8n/values.yaml
    - repoURL: https://github.com/luzero-luvis/argo-k8s-gitops.git
      targetRevision: main
      ref: values
    - repoURL: https://github.com/luzero-luvis/argo-k8s-gitops.git
      targetRevision: main
      path: services/n8n/resources
  destination:
    server: https://kubernetes.default.svc
    namespace: n8n
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
  # The ExternalSecret CRD automatically injects default values into fields
  # (conversionStrategy, decodingStrategy, metadataPolicy, deletionPolicy)
  # that are not written in git. ArgoCD sees them as a diff and marks the app
  # OutOfSync even though nothing is wrong. These entries tell ArgoCD to
  # ignore those CRD-injected defaults when comparing git vs cluster.
  ignoreDifferences:
    - group: external-secrets.io
      kind: ExternalSecret
      jqPathExpressions:
        - .spec.data[].remoteRef.conversionStrategy
        - .spec.data[].remoteRef.decodingStrategy
        - .spec.data[].remoteRef.metadataPolicy
        - .spec.target.deletionPolicy
    # StatefulSet volumeClaimTemplates are immutable after creation — Kubernetes
    # adds defaults (apiVersion, kind, volumeMode, status) and newer k8s versions
    # also inject persistentVolumeClaimRetentionPolicy. None of these can be
    # patched back by ArgoCD, so we ignore the whole VCT block to prevent a
    # permanent false OutOfSync.
    - group: apps
      kind: StatefulSet
      name: n8n
      jqPathExpressions:
        - .spec.volumeClaimTemplates
        - .spec.persistentVolumeClaimRetentionPolicy
