apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: redis-auth
  namespace: redis
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  length: 32
  digits: 6
  symbols: 4
  symbolCharacters: "-_$@"
  allowRepeat: true
---
# Also builds the "users.acl" key: a hand-rolled ACL file (default + app
# users) mounted directly via master/replica.extraVolumes at a standalone
# path, bypassing the chart's own auth.acl.enabled mount -- that mount nests
# a subPath Secret mount inside the (kubelet-enforced read-only) ConfigMap
# directory at /opt/bitnami/redis/mounted-etc, which fails with
# "OCI runtime create failed ... not a directory" on every node in this
# cluster. See values.yaml and https://github.com/bitnami/charts/issues/36557
# (never fixed upstream; bitnami/redis chart is unmaintained).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: redis-auth
  namespace: redis
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshPolicy: CreatedOnce
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: redis-auth
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        password: "{{ .password }}"
        users.acl: |
          user default on >{{ .password }} ~* &* +@all
          user app on >{{ .appPassword }} ~* &* +@all
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: redis-auth
  data:
    - secretKey: appPassword
      remoteRef:
        key: kv/data/devops/redis
        property: acl-app-password
