apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ollama-qwen
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: workloads
  source:
    repoURL: https://github.com/luzero-luvis/argo-k8s-gitops.git
    targetRevision: main
    path: workloads/ollama-qwen/resources
  destination:
    server: https://kubernetes.default.svc
    namespace: ai
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
