apiVersion: v1
kind: Service
metadata:
  name: ollama-headless
  namespace: ai
  labels:
    app.kubernetes.io/name: ollama
    app.kubernetes.io/part-of: local-ai
spec:
  # Governing Service for the StatefulSet. Client traffic continues through
  # the separate ClusterIP Service named `ollama`.
  clusterIP: None
  selector:
    app.kubernetes.io/name: ollama
  ports:
    - name: http
      port: 11434
      targetPort: http
      protocol: TCP
