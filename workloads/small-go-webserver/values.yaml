image:
  name: ghcr.io/luzero-luvis/small-go-webserver:v1.0.1@sha256:a3fa35b0f92375da41e198375a0734441c86276bee214b2220298f933452045c
  pullPolicy: IfNotPresent
replicaCount: 2
rollout:
  # Enable only after a staged handover from the live Deployment.
  enabled: false
  blueGreen:
    autoPromotionEnabled: true
  analysis:
    enabled: true
    k6:
      path: /
      vus: 5
      duration: 30s
      maxFailureRate: 0.05
      maxP95Ms: 1000
    prometheus:
      minReadyPods: 2
containerPort: 8080
service:
  type: ClusterIP
  port: 80
  targetPort: 8080
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 128Mi
readinessProbe:
  enabled: true
  type: tcpSocket
  tcpSocket:
    port: 8080
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 5
  successThreshold: 1
  failureThreshold: 3
livenessProbe:
  enabled: true
  type: tcpSocket
  tcpSocket:
    port: 8080
  initialDelaySeconds: 10
  periodSeconds: 30
  timeoutSeconds: 5
  successThreshold: 1
  failureThreshold: 3

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

podDisruptionBudget:
  enabled: true
  minAvailable: 1

httproute:
  enabled: true
  redirectToHttps: true
  hostnames:
    - small-go-webserver.example.com
  gateway:
    name: platform-gateway
    namespace: istio-system
    sectionName: http
    sectionNameHttps: https
  requestTimeout: "0s"
